# Portable RTCP v1.  RTCP is always disabled after Klipper starts.
# Include this file only after installing klippy/extras/rtcp.py.
#
# Logical G-code XYZ is the workpiece/platform coordinate at U=V=0.
# The current machine defines that origin at the measured rotation center.
# U and V are natural machine joint angles in degrees.
[rtcp]
pivot_x: 0.0
pivot_y: 0.0
pivot_z: 0.0

# Vision/task registration in bed-zero-pose axes, not post-rotation machine XY.
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0

# Change a sign only after a controlled direction test.
u_sign: 1
v_sign: 1
u_zero_deg: 0.0
v_zero_deg: 0.0

# Conservative controller-angle envelope. Physical XYZ limits come from Klipper.
u_min_deg: -90.0
u_max_deg: 90.0
v_min_deg: -720.0
v_max_deg: 720.0

# A G1 is adaptively split before any segment is queued. The full command is
# rejected if the error bound, axis limits or segment budget cannot be met.
chord_tolerance_mm: 0.02
max_depth: 20
max_segments: 100000

# v1 deliberately refuses nonzero XYZ G92/work offsets and bed-mesh transforms.
require_no_work_offsets: True
